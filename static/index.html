<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Local Meeting Summarizer</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>🎙️ Local Meeting Summarizer</h1>
      <p class="subtitle">100% offline — audio in, structured notes out.</p>
    </header>

    <div class="tabs">
      <button class="tab-btn active" data-tab="new">New Meeting</button>
      <button class="tab-btn" data-tab="history">History</button>
    </div>

    <!-- New Meeting Tab -->
    <section id="new" class="tab-content active">
      <div class="upload-box">
        <input type="file" id="audioFile" accept="audio/*" />
        <button id="processBtn">Transcribe & Summarize</button>
      </div>

      <div id="loading" class="hidden">
        <p>⏳ Processing locally... this can take a minute for longer audio.</p>
      </div>

      <div id="results" class="hidden">
        <h2>Summary</h2>
        <p id="summaryText"></p>

        <h2>Key Decisions</h2>
        <ul id="decisionsList"></ul>

        <h2>Action Items</h2>
        <ul id="actionItemsList"></ul>

        <details>
          <summary>Full Transcript</summary>
          <p id="transcriptText"></p>
        </details>
      </div>
    </section>

    <!-- History Tab -->
    <section id="history" class="tab-content">
      <div id="meetingList"></div>
      <div id="meetingDetail" class="hidden"></div>
    </section>
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
